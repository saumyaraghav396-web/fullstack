<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Bootstrap Slider</title>

    <!-- Bootstrap CSS -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <style>

        /* ===== BODY ===== */
        body {
            margin: 0;
            padding: 0;
            background: #f5f5f5;
            font-family: Arial, sans-serif;
        }

        /* ===== SLIDER ===== */
        #mySlider {
            width: 100%;
            height: 500px;
        }

        .carousel-item {
            height: 500px;
            position: relative;
        }

        /* ===== SLIDER IMAGE ===== */
        .carousel-item img {
            width: 100%;
            height: 500px;
            object-fit: cover;
        }

        /* ===== DARK OVERLAY ===== */
        .carousel-item::after {
            content: "";
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.45);
        }

        /* ===== CAPTION ===== */
        .carousel-caption {
            position: absolute;
            z-index: 2;

            top: 50%;
            left: 50%;

            transform: translate(-50%, -50%);

            width: 70%;
            text-align: center;
        }

        .carousel-caption h1 {
            font-size: 50px;
            font-weight: bold;
            color: white;
        }

        .carousel-caption p {
            font-size: 20px;
            color: white;
            margin: 20px 0;
        }

        /* ===== BUTTON ===== */
        .carousel-caption .btn {
            padding: 12px 30px;
            border-radius: 30px;
            font-size: 16px;
        }

        /* ===== INDICATORS ===== */
        .carousel-indicators {
            z-index: 3;
        }

        .carousel-indicators button {
            width: 12px;
            height: 12px;
            border-radius: 50%;
        }

        /* ===== PREVIOUS/NEXT BUTTON ===== */
        .carousel-control-prev,
        .carousel-control-next {
            z-index: 3;
        }

        /* ===== MOBILE ===== */
        @media (max-width: 768px) {

            #mySlider,
            .carousel-item,
            .carousel-item img {
                height: 350px;
            }

            .carousel-caption {
                width: 90%;
            }

            .carousel-caption h1 {
                font-size: 30px;
            }

            .carousel-caption p {
                font-size: 16px;
            }
        }

    </style>
</head>

<body>


<!-- ================= SLIDER ================= -->

<div id="mySlider"
     class="carousel slide"
     data-bs-ride="carousel"
     data-bs-interval="3000">


    <!-- ===== INDICATORS ===== -->

    <div class="carousel-indicators">

        <button type="button"
                data-bs-target="#mySlider"
                data-bs-slide-to="0"
                class="active">
        </button>

        <button type="button"
                data-bs-target="#mySlider"
                data-bs-slide-to="1">
        </button>

        <button type="button"
                data-bs-target="#mySlider"
                data-bs-slide-to="2">
        </button>

    </div>


    <!-- ===== SLIDES ===== -->

    <div class="carousel-inner">


        <!-- SLIDE 1 -->

        <div class="carousel-item active">

            <img
                src="https://images.unsplash.com/photo-1506744038136-46273834b3fb?auto=format&fit=crop&w=1600&q=80"
                alt="Nature">

            <div class="carousel-caption">

                <h1>Welcome</h1>

                <p>
                    This is the first slide.
                </p>

                <button class="btn btn-primary">
                    Learn More
                </button>

            </div>

        </div>


        <!-- SLIDE 2 -->

        <div class="carousel-item">

            <img
                src="https://images.unsplash.com/photo-1500530855697-b586d89ba3ee?auto=format&fit=crop&w=1600&q=80"
                alt="Mountain">

            <div class="carousel-caption">

                <h1>Bootstrap Slider</h1>

                <p>
                    This is the second slide.
                </p>

                <button class="btn btn-success">
                    Explore
                </button>

            </div>

        </div>


        <!-- SLIDE 3 -->

        <div class="carousel-item">

            <img
                src="https://images.unsplash.com/photo-1470770841072-f978cf4d019e?auto=format&fit=crop&w=1600&q=80"
                alt="Landscape">

            <div class="carousel-caption">

                <h1>Beautiful Design</h1>

                <p>
                    This is the third slide.
                </p>

                <button class="btn btn-danger">
                    Get Started
                </button>

            </div>

        </div>


    </div>


    <!-- ===== PREVIOUS BUTTON ===== -->

    <button class="carousel-control-prev"
            type="button"
            data-bs-target="#mySlider"
            data-bs-slide="prev">

        <span class="carousel-control-prev-icon"></span>

        <span class="visually-hidden">
            Previous
        </span>

    </button>


    <!-- ===== NEXT BUTTON ===== -->

    <button class="carousel-control-next"
            type="button"
            data-bs-target="#mySlider"
            data-bs-slide="next">

        <span class="carousel-control-next-icon"></span>

        <span class="visually-hidden">
            Next
        </span>

    </button>


</div>


<!-- ================= BOOTSTRAP JS ================= -->

<script
    src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
</script>


</body>
</html>
