<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CMJ Special</title>
    <style>
        fieldset{
            display: inline-block;
            width: 100px;
            height: 100px;
            border-color:black;
            
        }

    .left1,
    .right1{
        display: inline-block;
        width: 20%;
        height: 100px;
        margin: 0;
    } 
    
    .left1{
        background-color: lightcoral;
    }

    .right1{
        background-color: lightseagreen;
    }

    .left2,
    .right2{
        display: inline-block;
        width: 20%;
        height: 100px;
        margin: 0;
    } 
    
    .left2{
        background-color: lightcoral;
    }

    .right2{
        background-color: lightseagreen;
    }



        p~h1 {
            color: rgb(2, 29, 20);
            background-color: antiquewhite;
        }
        div, ::file-selector-button{
            width: 100px;
            height: 50px;
        }

    .box{
        transition:180px;
        width: 100px;
        height: 100px;
        border-color: black;
        background: radial-gradient(to button, blue,red,green,yellow,brown,lightpink);
        transition-duration: 5s;
    }
        
        
    </style>
</head>
<body>

    <p>Hello</p>
    <h1>Hello</h1>

    <fieldset style="background-color: aqua;">
        <label for="text">Hello</label>
    </fieldset>

    <br><br>

    <button>login</button>
    <input  type="text">
    <br>
    <br>

    <fieldset style="background-color: rgb(248, 225, 124);">
        <label for="text">Content</label>
    </fieldset>
    <br>
    <br>

    <div class="left1">Sameer</div>
    <div class="right1">Saumya</div>
    <div class="left2">Priyansh</div>
    <div class="right2">Lovkush</div>

    


    

</body>
</html>
